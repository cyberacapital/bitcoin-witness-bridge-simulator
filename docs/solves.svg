<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">What the paper solves</title>
<desc id="d">Left column, today: the two ways to use Bitcoin as a guarantee both depend on other people, a company or a set of watchers. Right column, with the paper: coins locked on Bitcoin open for whoever shows a valid proof. Bottom row, what the paper changed: about 8 GB per lock, seconds to lock or unlock as claimed, and no change to Bitcoin.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="476" fill="#FFFFFF"/>
<rect x="40" y="20" width="430" height="40" fill="#505A5F"/>
<text x="60" y="45.5" font-size="15.5" fill="#FFFFFF" font-weight="700">Today: trust other people</text>
<rect x="490" y="20" width="430" height="40" fill="#AF292E"/>
<text x="510" y="45.5" font-size="15.5" fill="#FFFFFF" font-weight="700">With the paper: trust a proof</text>
<rect x="40" y="72" width="430" height="60" fill="#F3F2F1"/>
<rect x="40" y="72" width="6" height="60" fill="#505A5F"/>
<text x="62" y="99" font-size="15" fill="#0B0C0C" font-weight="700">Option 1: trust a company</text>
<text x="62" y="119" font-size="12.5" fill="#505A5F">Risk: it fails or freezes your coins</text>
<rect x="40" y="164" width="430" height="60" fill="#F3F2F1"/>
<rect x="40" y="164" width="6" height="60" fill="#505A5F"/>
<text x="62" y="191" font-size="15" fill="#0B0C0C" font-weight="700">Option 2: trust watchers</text>
<text x="62" y="211" font-size="12.5" fill="#505A5F">Risk: one dispute cost over $14,000</text>
<rect x="40" y="256" width="430" height="60" fill="#F3F2F1"/>
<rect x="40" y="256" width="6" height="60" fill="#505A5F"/>
<text x="62" y="283" font-size="15" fill="#0B0C0C" font-weight="700">Either way</text>
<text x="62" y="303" font-size="12.5" fill="#505A5F">You depend on other people</text>
<rect x="490" y="72" width="430" height="60" fill="#F3F2F1"/>
<rect x="490" y="72" width="6" height="60" fill="#AF292E"/>
<text x="512" y="99" font-size="15" fill="#0B0C0C" font-weight="700">Coins are locked on Bitcoin</text>
<text x="512" y="119" font-size="12.5" fill="#505A5F">No person holds the key</text>
<rect x="490" y="164" width="430" height="60" fill="#F3F2F1"/>
<rect x="490" y="164" width="6" height="60" fill="#AF292E"/>
<text x="512" y="191" font-size="15" fill="#0B0C0C" font-weight="700">Someone shows a valid proof</text>
<text x="512" y="211" font-size="12.5" fill="#505A5F">Example: the loan was repaid</text>
<line x1="705" y1="136" x2="705" y2="159" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="490" y="256" width="430" height="60" fill="#F3F2F1"/>
<rect x="490" y="256" width="6" height="60" fill="#00703C"/>
<text x="512" y="283" font-size="15" fill="#0B0C0C" font-weight="700">The lock opens by itself</text>
<text x="512" y="303" font-size="12.5" fill="#505A5F">No keeper, no dispute, no new rules</text>
<line x1="705" y1="228" x2="705" y2="251" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="40" y="346" width="880" height="36" fill="#8A2024"/>
<text x="60" y="369.5" font-size="15.5" fill="#FFFFFF" font-weight="700">What the paper changed</text>
<rect x="40" y="392" width="280" height="64" fill="#FFFFFF" stroke="#B1B4B6" stroke-width="0.75"/>
<rect x="40" y="392" width="280" height="4" fill="#AF292E"/>
<text x="58" y="423" font-size="15" fill="#0B0C0C" font-weight="700">About 8 GB per lock</text>
<text x="58" y="443" font-size="12.5" fill="#505A5F">Down from 100s of TB</text>
<rect x="340" y="392" width="280" height="64" fill="#FFFFFF" stroke="#B1B4B6" stroke-width="0.75"/>
<rect x="340" y="392" width="280" height="4" fill="#AF292E"/>
<text x="358" y="423" font-size="15" fill="#0B0C0C" font-weight="700">Seconds (claimed)</text>
<text x="358" y="443" font-size="12.5" fill="#505A5F">To lock or unlock</text>
<rect x="640" y="392" width="280" height="64" fill="#FFFFFF" stroke="#B1B4B6" stroke-width="0.75"/>
<rect x="640" y="392" width="280" height="4" fill="#AF292E"/>
<text x="658" y="423" font-size="15" fill="#0B0C0C" font-weight="700">No Bitcoin changes</text>
<text x="658" y="443" font-size="12.5" fill="#505A5F">Needs no soft fork</text>
</svg>
