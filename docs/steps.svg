<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Figure 3.A: The seven steps of the bridge</title>
<desc id="d">On Bitcoin: 1 seal empty vaults, 2 deposit Bitcoin, 7 the vault opens for the burner. On Solana: 3 mint bridged Bitcoin, 4 launch a coin, 5 trade priced in Bitcoin, 6 burn with a secret mark. Proof of deposit leads from step 2 to step 3. Proof of the burn plus the secret leads from step 6 to step 7.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#505A5F"/></marker></defs>
<rect width="960" height="398" fill="#FFFFFF"/>
<text x="40" y="38" font-size="17" fill="#0B0C0C" font-weight="700">Figure 3.A: The seven steps of the bridge</text>
<line x1="40" y1="51" x2="920" y2="51" stroke="#0B0C0C" stroke-width="1.5"/>
<text x="40" y="76" font-size="13.5" fill="#505A5F">Two proofs join the chains: of the deposit on the way in, and of the burn on the way out.</text>
<rect x="40" y="140.0" width="98" height="19" fill="#F7E9EB"/>
<text x="48" y="154.0" font-size="11" fill="#8F1D2C" font-weight="700" letter-spacing="0.8">ON BITCOIN</text>
<rect x="152" y="118" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="152" y="118" width="4" height="60" fill="#8F1D2C"/>
<rect x="166" y="137" width="22" height="22" fill="#F7E9EB"/>
<text x="177.0" y="152.5" font-size="12.5" fill="#8F1D2C" font-weight="700" text-anchor="middle">1</text>
<text x="198" y="144" font-size="12.5" fill="#0B0C0C">Seal empty</text>
<text x="198" y="160" font-size="12.5" fill="#0B0C0C">vaults</text>
<rect x="310" y="118" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="310" y="118" width="4" height="60" fill="#8F1D2C"/>
<rect x="324" y="137" width="22" height="22" fill="#F7E9EB"/>
<text x="335.0" y="152.5" font-size="12.5" fill="#8F1D2C" font-weight="700" text-anchor="middle">2</text>
<text x="356" y="144" font-size="12.5" fill="#0B0C0C">Deposit</text>
<text x="356" y="160" font-size="12.5" fill="#0B0C0C">Bitcoin</text>
<rect x="784" y="118" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="784" y="118" width="4" height="60" fill="#8F1D2C"/>
<rect x="798" y="137" width="22" height="22" fill="#F7E9EB"/>
<text x="809.0" y="152.5" font-size="12.5" fill="#8F1D2C" font-weight="700" text-anchor="middle">7</text>
<text x="830" y="144" font-size="12.5" fill="#0B0C0C">Vault opens</text>
<text x="830" y="160" font-size="12.5" fill="#0B0C0C">for the burner</text>
<line x1="291" y1="148.0" x2="306" y2="148.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="454" y1="148.0" x2="776" y2="148.0" stroke="#B1B4B6" stroke-width="1.6" stroke-dasharray="2 5"/>
<text x="615.0" y="139.0" font-size="12.5" fill="#505A5F" text-anchor="middle" font-style="italic">the Bitcoin stays sealed in the vault</text>
<rect x="40" y="280.0" width="90" height="19" fill="#E7EEF5"/>
<text x="48" y="294.0" font-size="11" fill="#1D4E7A" font-weight="700" letter-spacing="0.8">ON SOLANA</text>
<rect x="310" y="258" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="310" y="258" width="4" height="60" fill="#1D4E7A"/>
<rect x="324" y="277" width="22" height="22" fill="#E7EEF5"/>
<text x="335.0" y="292.5" font-size="12.5" fill="#1D4E7A" font-weight="700" text-anchor="middle">3</text>
<text x="356" y="284" font-size="12.5" fill="#0B0C0C">Mint bridged</text>
<text x="356" y="300" font-size="12.5" fill="#0B0C0C">Bitcoin</text>
<rect x="468" y="258" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="468" y="258" width="4" height="60" fill="#1D4E7A"/>
<rect x="482" y="277" width="22" height="22" fill="#E7EEF5"/>
<text x="493.0" y="292.5" font-size="12.5" fill="#1D4E7A" font-weight="700" text-anchor="middle">4</text>
<text x="514" y="284" font-size="12.5" fill="#0B0C0C">Launch</text>
<text x="514" y="300" font-size="12.5" fill="#0B0C0C">a coin</text>
<rect x="626" y="258" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="626" y="258" width="4" height="60" fill="#1D4E7A"/>
<rect x="640" y="277" width="22" height="22" fill="#E7EEF5"/>
<text x="651.0" y="292.5" font-size="12.5" fill="#1D4E7A" font-weight="700" text-anchor="middle">5</text>
<text x="672" y="284" font-size="12.5" fill="#0B0C0C">Trade, priced</text>
<text x="672" y="300" font-size="12.5" fill="#0B0C0C">in Bitcoin</text>
<rect x="784" y="258" width="136" height="60" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="784" y="258" width="4" height="60" fill="#1D4E7A"/>
<rect x="798" y="277" width="22" height="22" fill="#E7EEF5"/>
<text x="809.0" y="292.5" font-size="12.5" fill="#1D4E7A" font-weight="700" text-anchor="middle">6</text>
<text x="830" y="284" font-size="12.5" fill="#0B0C0C">Burn with a</text>
<text x="830" y="300" font-size="12.5" fill="#0B0C0C">secret mark</text>
<line x1="449" y1="288.0" x2="464" y2="288.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="607" y1="288.0" x2="622" y2="288.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="765" y1="288.0" x2="780" y2="288.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="378.0" y1="182" x2="378.0" y2="253" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="852.0" y1="254" x2="852.0" y2="183" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<text x="390.0" y="222.5" font-size="12.5" fill="#505A5F" font-style="italic">proof of deposit</text>
<text x="840.0" y="222.5" font-size="12.5" fill="#505A5F" text-anchor="end" font-style="italic">proof of burn plus secret</text>
<line x1="40" y1="344" x2="920" y2="344" stroke="#B1B4B6" stroke-width="1"/>
<text x="40" y="364" font-size="12.5" fill="#0B0C0C"><tspan font-weight="700">The numbers are those of the steps in the text.</tspan> Bitcoin is on the upper line and Solana on the lower.</text>
<text x="40" y="383" font-size="11.5" fill="#505A5F">Source: Bitcoin Witness Bridge Simulator.</text>
</svg>
