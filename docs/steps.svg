<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">The seven steps of the bridge</title>
<desc id="d">On Bitcoin: 1 seal empty vaults, 2 deposit Bitcoin, 7 the vault opens for the burner. On Solana: 3 mint bridged Bitcoin, 4 launch a coin, 5 trade priced in Bitcoin, 6 burn with a secret mark. Proof of deposit leads from step 2 to step 3. Proof of the burn plus the secret leads from step 6 to step 7. Between deposit and opening the Bitcoin stays sealed in the vault.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="370" fill="#FFFFFF"/>
<rect x="40" y="20" width="880" height="44" fill="#AF292E"/>
<text x="60" y="47.5" font-size="15.5" fill="#FFFFFF" font-weight="700">The seven steps of the bridge</text>
<rect x="40" y="96" width="110" height="30" fill="#8A2024"/>
<text x="60" y="116.5" font-size="15.5" fill="#FFFFFF" font-weight="700">On Bitcoin</text>
<rect x="160" y="82" width="136" height="58" fill="#F3F2F1"/>
<rect x="160" y="82" width="6" height="58" fill="#AF292E"/>
<rect x="176" y="100" width="22" height="22" fill="#AF292E"/>
<text x="187" y="115.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="207" y="108" font-size="12.5" fill="#0B0C0C">Seal empty</text>
<text x="207" y="124" font-size="12.5" fill="#0B0C0C">vaults</text>
<rect x="316" y="82" width="136" height="58" fill="#F3F2F1"/>
<rect x="316" y="82" width="6" height="58" fill="#AF292E"/>
<rect x="332" y="100" width="22" height="22" fill="#AF292E"/>
<text x="343" y="115.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="363" y="108" font-size="12.5" fill="#0B0C0C">Deposit</text>
<text x="363" y="124" font-size="12.5" fill="#0B0C0C">Bitcoin</text>
<rect x="784" y="82" width="136" height="58" fill="#F3F2F1"/>
<rect x="784" y="82" width="6" height="58" fill="#00703C"/>
<rect x="800" y="100" width="22" height="22" fill="#00703C"/>
<text x="811" y="115.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">7</text>
<text x="831" y="108" font-size="12.5" fill="#0B0C0C">Vault opens</text>
<text x="831" y="124" font-size="12.5" fill="#0B0C0C">for the burner</text>
<line x1="299" y1="111.0" x2="312" y2="111.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="460" y1="111.0" x2="776" y2="111.0" stroke="#B1B4B6" stroke-width="1.6" stroke-dasharray="2 5"/>
<text x="618.0" y="102.0" font-size="12.5" fill="#505A5F" text-anchor="middle" font-style="italic">the Bitcoin stays sealed in the vault</text>
<rect x="40" y="228" width="110" height="30" fill="#8A2024"/>
<text x="60" y="248.5" font-size="15.5" fill="#FFFFFF" font-weight="700">On Solana</text>
<rect x="316" y="214" width="136" height="58" fill="#F3F2F1"/>
<rect x="316" y="214" width="6" height="58" fill="#AF292E"/>
<rect x="332" y="232" width="22" height="22" fill="#AF292E"/>
<text x="343" y="247.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="363" y="240" font-size="12.5" fill="#0B0C0C">Mint bridged</text>
<text x="363" y="256" font-size="12.5" fill="#0B0C0C">Bitcoin</text>
<rect x="472" y="214" width="136" height="58" fill="#F3F2F1"/>
<rect x="472" y="214" width="6" height="58" fill="#AF292E"/>
<rect x="488" y="232" width="22" height="22" fill="#AF292E"/>
<text x="499" y="247.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="519" y="240" font-size="12.5" fill="#0B0C0C">Launch</text>
<text x="519" y="256" font-size="12.5" fill="#0B0C0C">a coin</text>
<rect x="628" y="214" width="136" height="58" fill="#F3F2F1"/>
<rect x="628" y="214" width="6" height="58" fill="#AF292E"/>
<rect x="644" y="232" width="22" height="22" fill="#AF292E"/>
<text x="655" y="247.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="675" y="240" font-size="12.5" fill="#0B0C0C">Trade, priced</text>
<text x="675" y="256" font-size="12.5" fill="#0B0C0C">in Bitcoin</text>
<rect x="784" y="214" width="136" height="58" fill="#F3F2F1"/>
<rect x="784" y="214" width="6" height="58" fill="#AF292E"/>
<rect x="800" y="232" width="22" height="22" fill="#AF292E"/>
<text x="811" y="247.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="831" y="240" font-size="12.5" fill="#0B0C0C">Burn with a</text>
<text x="831" y="256" font-size="12.5" fill="#0B0C0C">secret mark</text>
<line x1="455" y1="243.0" x2="468" y2="243.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="611" y1="243.0" x2="624" y2="243.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="767" y1="243.0" x2="780" y2="243.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="384.0" y1="145" x2="384.0" y2="208" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="852.0" y1="209" x2="852.0" y2="146" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<text x="396.0" y="181.5" font-size="12.5" fill="#505A5F" font-style="italic">proof of deposit</text>
<text x="840.0" y="181.5" font-size="12.5" fill="#505A5F" text-anchor="end" font-style="italic">proof of burn plus secret</text>
<rect x="40" y="290" width="880" height="60" fill="#F3F2F1"/>
<rect x="40" y="290" width="6" height="60" fill="#505A5F"/>
<text x="62" y="317" font-size="15" fill="#0B0C0C" font-weight="700">The numbers are those of the steps in the text</text>
<text x="62" y="337" font-size="12.5" fill="#505A5F">Two proofs join the chains: of the deposit on the way in, and of the burn on the way out.</text>
</svg>
