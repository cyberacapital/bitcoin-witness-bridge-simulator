<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
<title id="t">How the simulated bridge works, and what is in this repository</title>
<desc id="d">Bitcoin is sent to a vault whose key is sealed in a lock. Solana mints the same amount as tokens. Tokens are used to launch and trade coins. Burning tokens gives a proof that opens the lock and releases the Bitcoin. The repository holds a model of the bridge, the lock scheme at toy size, and a proof checker written for the lock.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#57606A"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#FCFBF8" stroke="#E5E1D8"/>
<text x="40" y="52" font-size="24" fill="#1F2328" font-weight="700">A Bitcoin to Solana bridge with no operator</text>
<text x="40" y="78" font-size="14" fill="#57606A">Bitcoin is locked so that only proof of a burn on Solana can release it. This repository models that from end to end.</text>
<rect x="40" y="97" width="98" height="19" rx="9.5" fill="#FFF1DD"/>
<text x="48" y="111" font-size="11" fill="#C96A00" font-weight="700" letter-spacing="0.8">ON BITCOIN</text>
<rect x="40" y="124" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="40" y="124" width="5" height="120" rx="2.5" fill="#C96A00"/>
<rect x="56" y="137" width="22" height="22" rx="11" fill="#FFF1DD"/>
<text x="67.0" y="152.5" font-size="12.5" fill="#C96A00" font-weight="700" text-anchor="middle">1</text>
<text x="87" y="153.5" font-size="15.5" fill="#1F2328" font-weight="700">Seal</text>
<text x="56" y="182.0" font-size="12.5" fill="#1F2328">A vault is made. Its key is</text>
<text x="56" y="199.5" font-size="12.5" fill="#1F2328">cut into pieces, each sealed</text>
<text x="56" y="217.0" font-size="12.5" fill="#1F2328">in a lock, then deleted.</text>
<rect x="267" y="124" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="267" y="124" width="5" height="120" rx="2.5" fill="#C96A00"/>
<rect x="283" y="137" width="22" height="22" rx="11" fill="#FFF1DD"/>
<text x="294.0" y="152.5" font-size="12.5" fill="#C96A00" font-weight="700" text-anchor="middle">2</text>
<text x="314" y="153.5" font-size="15.5" fill="#1F2328" font-weight="700">Deposit</text>
<text x="283" y="182.0" font-size="12.5" fill="#1F2328">A user sends Bitcoin to</text>
<text x="283" y="199.5" font-size="12.5" fill="#1F2328">the vault.</text>
<rect x="720" y="124" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="720" y="124" width="5" height="120" rx="2.5" fill="#C96A00"/>
<rect x="736" y="137" width="22" height="22" rx="11" fill="#FFF1DD"/>
<text x="747.0" y="152.5" font-size="12.5" fill="#C96A00" font-weight="700" text-anchor="middle">7</text>
<text x="767" y="153.5" font-size="15.5" fill="#1F2328" font-weight="700">Open</text>
<text x="736" y="182.0" font-size="12.5" fill="#1F2328">The proof opens the lock.</text>
<text x="736" y="199.5" font-size="12.5" fill="#1F2328">The burner gets the key and</text>
<text x="736" y="217.0" font-size="12.5" fill="#1F2328">moves the Bitcoin.</text>
<rect x="493" y="124" width="200" height="120" rx="10" fill="#F6F8FA" stroke="#57606A" stroke-dasharray="5 4"/>
<path d="M580.0 162 v-9 a13 13 0 0 1 26 0 v9" fill="none" stroke="#1F2328" stroke-width="5" stroke-linecap="round"/>
<rect x="572.0" y="162" width="42" height="32" rx="6" fill="#1F2328"/>
<circle cx="593.0" cy="175" r="4.2" fill="#F6F8FA"/><rect x="591.4" y="176" width="3.2" height="9" rx="1.6" fill="#F6F8FA"/>
<text x="593.0" y="216" font-size="12.5" fill="#1F2328" font-weight="700" text-anchor="middle">Nobody holds the key.</text>
<text x="593.0" y="233" font-size="12.5" fill="#57606A" text-anchor="middle">Opens only for a valid proof.</text>
<rect x="40" y="315" width="90" height="19" rx="9.5" fill="#F1EAFE"/>
<text x="48" y="329" font-size="11" fill="#6D3FD6" font-weight="700" letter-spacing="0.8">ON SOLANA</text>
<text x="40" y="362" font-size="12.5" fill="#57606A">The rule that always holds:</text>
<text x="40" y="384" font-size="14" fill="#1F2328" font-weight="700">tokens in circulation</text>
<text x="40" y="403" font-size="14" fill="#1F2328" font-weight="700">= Bitcoin sealed in vaults</text>
<rect x="267" y="312" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="267" y="312" width="5" height="120" rx="2.5" fill="#6D3FD6"/>
<rect x="283" y="325" width="22" height="22" rx="11" fill="#F1EAFE"/>
<text x="294.0" y="340.5" font-size="12.5" fill="#6D3FD6" font-weight="700" text-anchor="middle">3</text>
<text x="314" y="341.5" font-size="15.5" fill="#1F2328" font-weight="700">Mint</text>
<text x="283" y="370.0" font-size="12.5" fill="#1F2328">Solana checks the deposit</text>
<text x="283" y="387.5" font-size="12.5" fill="#1F2328">against Bitcoin's blocks and</text>
<text x="283" y="405.0" font-size="12.5" fill="#1F2328">mints the same amount.</text>
<rect x="493" y="312" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="493" y="312" width="5" height="120" rx="2.5" fill="#6D3FD6"/>
<rect x="509" y="325" width="36" height="22" rx="11" fill="#F1EAFE"/>
<text x="527.0" y="340.5" font-size="12.5" fill="#6D3FD6" font-weight="700" text-anchor="middle">4–5</text>
<text x="554" y="341.5" font-size="15.5" fill="#1F2328" font-weight="700">Launch, trade</text>
<text x="509" y="370.0" font-size="12.5" fill="#1F2328">Tokens move like any others:</text>
<text x="509" y="387.5" font-size="12.5" fill="#1F2328">launch a coin against them,</text>
<text x="509" y="405.0" font-size="12.5" fill="#1F2328">buy and sell it.</text>
<rect x="720" y="312" width="200" height="120" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<rect x="720" y="312" width="5" height="120" rx="2.5" fill="#6D3FD6"/>
<rect x="736" y="325" width="22" height="22" rx="11" fill="#F1EAFE"/>
<text x="747.0" y="340.5" font-size="12.5" fill="#6D3FD6" font-weight="700" text-anchor="middle">6</text>
<text x="767" y="341.5" font-size="15.5" fill="#1F2328" font-weight="700">Burn</text>
<text x="736" y="370.0" font-size="12.5" fill="#1F2328">A holder burns tokens and</text>
<text x="736" y="387.5" font-size="12.5" fill="#1F2328">attaches the fingerprint of</text>
<text x="736" y="405.0" font-size="12.5" fill="#1F2328">a secret.</text>
<line x1="243" y1="184.0" x2="263" y2="184.0" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="184.0" x2="489" y2="184.0" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="696" y1="184.0" x2="716" y2="184.0" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="470" y1="372.0" x2="489" y2="372.0" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="696" y1="372.0" x2="716" y2="372.0" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="367.0" y1="248" x2="367.0" y2="307" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="820.0" y1="308" x2="820.0" y2="249" stroke="#57606A" stroke-width="1.6" marker-end="url(#a)"/>
<text x="379.0" y="282.5" font-size="12.5" fill="#57606A" font-style="italic">proof of deposit</text>
<text x="808.0" y="282.5" font-size="12.5" fill="#57606A" text-anchor="end" font-style="italic">proof of burn, plus the secret</text>
<line x1="40" y1="462" x2="920" y2="462" stroke="#E5E1D8"/>
<text x="40" y="490" font-size="15.5" fill="#1F2328" font-weight="700">What is in the repository</text>
<rect x="40" y="504" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="56" y="531" font-size="13.5" fill="#1F2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">bridge_sim/</text>
<text x="56" y="553" font-size="12.5" fill="#57606A">The whole bridge as a runnable model,</text>
<text x="56" y="570" font-size="12.5" fill="#57606A">attacks included. Its lock is simulated.</text>
<rect x="340" y="504" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="356" y="531" font-size="13.5" fill="#1F2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">praxis_lock/</text>
<text x="356" y="553" font-size="12.5" fill="#57606A">The lock scheme itself, from the Praxis</text>
<text x="356" y="570" font-size="12.5" fill="#57606A">paper, at toy size with real pairings.</text>
<rect x="640" y="504" width="280" height="84" rx="10" fill="#FFFFFF" stroke="#D0D7DE"/>
<text x="656" y="531" font-size="13.5" fill="#1F2328" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">praxis_lock/encoding/</text>
<text x="656" y="553" font-size="12.5" fill="#57606A">A proof checker rewritten for the lock.</text>
<text x="656" y="570" font-size="12.5" fill="#57606A">Runs on real proofs, 1.4× the paper's size.</text>
<circle cx="46" cy="613.5" r="4.5" fill="#B35900"/>
<text x="58" y="618" font-size="12.5" fill="#1F2328"><tspan font-weight="700">Simulator only.</tspan> No real network, no real money, not audited.</text>
</svg>
