<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 584" width="960" height="584" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Figure 2.C: Three other locks, step by step</title>
<desc id="d">Each follows the bridge's pattern: seal a secret to a rule, wait until the rule can be proven, open. Time lock: sealed to Bitcoin growing by a number of blocks; anyone opens it by showing the block headers. Reward: sealed to a solution of a puzzle; the solver opens it. Credential: sealed to holding a certificate; any holder opens it.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#505A5F"/></marker></defs>
<rect width="960" height="584" fill="#FFFFFF"/>
<text x="40" y="38" font-size="17" fill="#0B0C0C" font-weight="700">Figure 2.C: Three other locks, step by step</text>
<line x1="40" y1="51" x2="920" y2="51" stroke="#0B0C0C" stroke-width="1.5"/>
<text x="40" y="76" font-size="13.5" fill="#505A5F">Each follows the bridge's pattern: seal a secret to a rule, wait until the rule can be proven, open.</text>
<text x="40" y="124" font-size="15.5" fill="#0B0C0C" font-weight="700">Time lock</text>
<rect x="132" y="110" width="123" height="19" fill="#0B0C0C" stroke="#0B0C0C"/>
<text x="140" y="124" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">MODELLED HERE</text>
<rect x="40" y="138" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="56" y="160" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">SEAL</text>
<text x="56" y="183" font-size="12.5" fill="#0B0C0C">Anyone seals a message to: “Bitcoin</text>
<text x="56" y="201" font-size="12.5" fill="#0B0C0C">has grown 52,560 blocks past block X.”</text>
<rect x="340" y="138" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="356" y="160" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">THEN</text>
<text x="356" y="183" font-size="12.5" fill="#0B0C0C">About a year of blocks is mined.</text>
<text x="356" y="201" font-size="12.5" fill="#0B0C0C">Nobody has to do anything.</text>
<line x1="323" y1="182.0" x2="336" y2="182.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="640" y="138" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="656" y="160" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">OPEN</text>
<text x="656" y="183" font-size="12.5" fill="#0B0C0C">Anyone shows the block headers</text>
<text x="656" y="201" font-size="12.5" fill="#0B0C0C">and reads the message.</text>
<line x1="623" y1="182.0" x2="636" y2="182.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="262" font-size="15.5" fill="#0B0C0C" font-weight="700">Reward for a solution</text>
<rect x="237" y="248" width="123" height="19" fill="#FFFFFF" stroke="#0B0C0C"/>
<text x="245" y="262" font-size="11" fill="#0B0C0C" font-weight="700" letter-spacing="0.8">TOY DEMO HERE</text>
<rect x="40" y="276" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="56" y="298" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">SEAL</text>
<text x="56" y="321" font-size="12.5" fill="#0B0C0C">A sponsor seals the key to a reward</text>
<text x="56" y="339" font-size="12.5" fill="#0B0C0C">to: “here is a solution to this puzzle.”</text>
<rect x="340" y="276" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="356" y="298" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">THEN</text>
<text x="356" y="321" font-size="12.5" fill="#0B0C0C">Someone finds a solution.</text>
<text x="356" y="339" font-size="12.5" fill="#0B0C0C">The sponsor can be long gone.</text>
<line x1="323" y1="320.0" x2="336" y2="320.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="640" y="276" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="656" y="298" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">OPEN</text>
<text x="656" y="321" font-size="12.5" fill="#0B0C0C">The solver opens the lock and takes</text>
<text x="656" y="339" font-size="12.5" fill="#0B0C0C">the reward. No judge decides.</text>
<line x1="623" y1="320.0" x2="636" y2="320.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="400" font-size="15.5" fill="#0B0C0C" font-weight="700">Sending to a credential</text>
<rect x="254" y="386" width="90" height="19" fill="#F3F2F1" stroke="#B1B4B6"/>
<text x="262" y="400" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<rect x="40" y="414" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="56" y="436" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">SEAL</text>
<text x="56" y="459" font-size="12.5" fill="#0B0C0C">A sender seals a file to: “I hold this</text>
<text x="56" y="477" font-size="12.5" fill="#0B0C0C">registry's certificate for a doctor.”</text>
<rect x="340" y="414" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="356" y="436" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">THEN</text>
<text x="356" y="459" font-size="12.5" fill="#0B0C0C">A doctor holds such a certificate,</text>
<text x="356" y="477" font-size="12.5" fill="#0B0C0C">or is issued one later.</text>
<line x1="323" y1="458.0" x2="336" y2="458.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="640" y="414" width="280" height="88" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="656" y="436" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">OPEN</text>
<text x="656" y="459" font-size="12.5" fill="#0B0C0C">Any holder opens it. The sender</text>
<text x="656" y="477" font-size="12.5" fill="#0B0C0C">never learns who did.</text>
<line x1="623" y1="458.0" x2="636" y2="458.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="40" y1="528" x2="920" y2="528" stroke="#B1B4B6" stroke-width="1"/>
<text x="40" y="548" font-size="12.5" fill="#0B0C0C"><tspan font-weight="700">Limits shared by all of them:</tspan> the rule is fixed when the lock is made, and whoever holds a proof can open.</text>
<text x="40" y="567" font-size="11.5" fill="#505A5F">Source: Bitcoin Witness Bridge Simulator.</text>
</svg>
