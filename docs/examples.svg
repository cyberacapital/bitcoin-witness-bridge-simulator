<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Three other locks, step by step</title>
<desc id="d">Each follows the bridge's pattern: seal a secret to a rule, wait until the rule can be proven, open. Time lock (modelled here): sealed to Bitcoin growing by a number of blocks; anyone opens it by showing the block headers. Reward (tiny demo here): sealed to a solution of a puzzle; the solver opens it. Credential (not coded): sealed to holding a certificate; any holder opens it.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="574" fill="#FFFFFF"/>
<rect x="40" y="20" width="880" height="44" fill="#AF292E"/>
<text x="60" y="47.5" font-size="15.5" fill="#FFFFFF" font-weight="700">Three other locks, step by step</text>
<rect x="40" y="76" width="880" height="34" fill="#8A2024"/>
<text x="60" y="98.5" font-size="15.5" fill="#FFFFFF" font-weight="700">Time lock</text>
<text x="900" y="97.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="end" letter-spacing="0.8">MODELLED HERE</text>
<rect x="40" y="120" width="280" height="82" fill="#F3F2F1"/>
<rect x="40" y="120" width="6" height="82" fill="#AF292E"/>
<text x="62" y="147" font-size="15" fill="#0B0C0C" font-weight="700">Seal</text>
<text x="62" y="167" font-size="12.5" fill="#505A5F">Anyone seals a message to: “Bitcoin</text>
<text x="62" y="184" font-size="12.5" fill="#505A5F">has grown 52,560 blocks past block X.”</text>
<rect x="340" y="120" width="280" height="82" fill="#F3F2F1"/>
<rect x="340" y="120" width="6" height="82" fill="#AF292E"/>
<text x="362" y="147" font-size="15" fill="#0B0C0C" font-weight="700">Then</text>
<text x="362" y="167" font-size="12.5" fill="#505A5F">About a year of blocks is mined.</text>
<text x="362" y="184" font-size="12.5" fill="#505A5F">Nobody has to do anything.</text>
<line x1="324" y1="161.0" x2="335" y2="161.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="640" y="120" width="280" height="82" fill="#F3F2F1"/>
<rect x="640" y="120" width="6" height="82" fill="#00703C"/>
<text x="662" y="147" font-size="15" fill="#0B0C0C" font-weight="700">Open</text>
<text x="662" y="167" font-size="12.5" fill="#505A5F">Anyone shows the block headers</text>
<text x="662" y="184" font-size="12.5" fill="#505A5F">and reads the message.</text>
<line x1="624" y1="161.0" x2="635" y2="161.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="40" y="216" width="880" height="34" fill="#8A2024"/>
<text x="60" y="238.5" font-size="15.5" fill="#FFFFFF" font-weight="700">Reward for a solution</text>
<text x="900" y="237.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="end" letter-spacing="0.8">TINY DEMO HERE</text>
<rect x="40" y="260" width="280" height="82" fill="#F3F2F1"/>
<rect x="40" y="260" width="6" height="82" fill="#AF292E"/>
<text x="62" y="287" font-size="15" fill="#0B0C0C" font-weight="700">Seal</text>
<text x="62" y="307" font-size="12.5" fill="#505A5F">A sponsor seals the key to a reward</text>
<text x="62" y="324" font-size="12.5" fill="#505A5F">to: “here is a solution to this puzzle.”</text>
<rect x="340" y="260" width="280" height="82" fill="#F3F2F1"/>
<rect x="340" y="260" width="6" height="82" fill="#AF292E"/>
<text x="362" y="287" font-size="15" fill="#0B0C0C" font-weight="700">Then</text>
<text x="362" y="307" font-size="12.5" fill="#505A5F">Someone finds a solution.</text>
<text x="362" y="324" font-size="12.5" fill="#505A5F">The sponsor can be long gone.</text>
<line x1="324" y1="301.0" x2="335" y2="301.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="640" y="260" width="280" height="82" fill="#F3F2F1"/>
<rect x="640" y="260" width="6" height="82" fill="#00703C"/>
<text x="662" y="287" font-size="15" fill="#0B0C0C" font-weight="700">Open</text>
<text x="662" y="307" font-size="12.5" fill="#505A5F">The solver opens the lock and takes</text>
<text x="662" y="324" font-size="12.5" fill="#505A5F">the reward. No judge decides.</text>
<line x1="624" y1="301.0" x2="635" y2="301.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="40" y="356" width="880" height="34" fill="#505A5F"/>
<text x="60" y="378.5" font-size="15.5" fill="#FFFFFF" font-weight="700">Sending to a credential</text>
<text x="900" y="377.0" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="end" letter-spacing="0.8">NOT CODED</text>
<rect x="40" y="400" width="280" height="82" fill="#F3F2F1"/>
<rect x="40" y="400" width="6" height="82" fill="#AF292E"/>
<text x="62" y="427" font-size="15" fill="#0B0C0C" font-weight="700">Seal</text>
<text x="62" y="447" font-size="12.5" fill="#505A5F">A sender seals a file to: “I hold this</text>
<text x="62" y="464" font-size="12.5" fill="#505A5F">registry's certificate for a doctor.”</text>
<rect x="340" y="400" width="280" height="82" fill="#F3F2F1"/>
<rect x="340" y="400" width="6" height="82" fill="#AF292E"/>
<text x="362" y="427" font-size="15" fill="#0B0C0C" font-weight="700">Then</text>
<text x="362" y="447" font-size="12.5" fill="#505A5F">A doctor holds such a certificate,</text>
<text x="362" y="464" font-size="12.5" fill="#505A5F">or is issued one later.</text>
<line x1="324" y1="441.0" x2="335" y2="441.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="640" y="400" width="280" height="82" fill="#F3F2F1"/>
<rect x="640" y="400" width="6" height="82" fill="#00703C"/>
<text x="662" y="427" font-size="15" fill="#0B0C0C" font-weight="700">Open</text>
<text x="662" y="447" font-size="12.5" fill="#505A5F">Any holder opens it. The sender</text>
<text x="662" y="464" font-size="12.5" fill="#505A5F">never learns who did.</text>
<line x1="624" y1="441.0" x2="635" y2="441.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="40" y="494" width="880" height="60" fill="#F3F2F1"/>
<rect x="40" y="494" width="6" height="60" fill="#505A5F"/>
<text x="62" y="521" font-size="15" fill="#0B0C0C" font-weight="700">Limits shared by all of them</text>
<text x="62" y="541" font-size="12.5" fill="#505A5F">The rule is fixed when the lock is made, and whoever holds a proof can open.</text>
</svg>
