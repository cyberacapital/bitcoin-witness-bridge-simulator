<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Figure 2.A: One lock, many uses</title>
<desc id="d">A secret is sealed to a rule and opens for whoever can prove the rule was met. Six uses: a bridge without a custodian and a time lock (both modelled here), a reward for a solution (toy demo here), and three that are not coded: sending to a credential, paying on Bitcoin when a proof exists, and spending rules on Bitcoin.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#505A5F"/></marker></defs>
<rect width="960" height="668" fill="#FFFFFF"/>
<text x="40" y="38" font-size="17" fill="#0B0C0C" font-weight="700">Figure 2.A: One lock, many uses</text>
<line x1="40" y1="51" x2="920" y2="51" stroke="#0B0C0C" stroke-width="1.5"/>
<text x="40" y="76" font-size="13.5" fill="#505A5F">The lock opens for whoever can prove that a rule was met. Change the rule and the same lock does another job.</text>
<rect x="40" y="104" width="250" height="92" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="60" y="134" font-size="15.5" fill="#0B0C0C" font-weight="700">A secret</text>
<text x="60" y="157.0" font-size="12.5" fill="#505A5F">a key, a file, a message</text>
<rect x="355" y="104" width="250" height="92" fill="#F3F2F1" stroke="#505A5F" stroke-dasharray="5 4"/>
<path d="M384 141 v-9 a13 13 0 0 1 26 0 v9" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="round"/>
<rect x="376" y="141" width="42" height="32" rx="3" fill="#0B0C0C"/>
<circle cx="397" cy="154" r="4.2" fill="#F3F2F1"/><rect x="395.4" y="155" width="3.2" height="9" rx="1.6" fill="#F3F2F1"/>
<text x="432" y="134" font-size="15.5" fill="#0B0C0C" font-weight="700">sealed to a rule</text>
<text x="432" y="157.0" font-size="12.5" fill="#505A5F" font-style="italic">“someone can prove</text>
<text x="432" y="174.5" font-size="12.5" fill="#505A5F" font-style="italic">that ...”</text>
<rect x="670" y="104" width="250" height="92" fill="#FFFFFF" stroke="#B1B4B6"/>
<text x="690" y="134" font-size="15.5" fill="#0B0C0C" font-weight="700">opens for any prover</text>
<text x="690" y="157.0" font-size="12.5" fill="#505A5F">no operator and no judge,</text>
<text x="690" y="174.5" font-size="12.5" fill="#505A5F">even if the sealer is gone</text>
<line x1="293" y1="150.0" x2="351" y2="150.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="608" y1="150.0" x2="666" y2="150.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="236" font-size="15.5" fill="#0B0C0C" font-weight="700">The same lock, with six different rules</text>
<rect x="40" y="252" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="56" y="267" width="123" height="19" fill="#0B0C0C" stroke="#0B0C0C"/>
<text x="64" y="281" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">MODELLED HERE</text>
<text x="56" y="310" font-size="15.5" fill="#0B0C0C" font-weight="700">Bridge without a custodian</text>
<text x="56" y="332" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="56" y="351" font-size="12.5" fill="#0B0C0C" font-style="italic">“these tokens were burned on Solana,</text>
<text x="56" y="368" font-size="12.5" fill="#0B0C0C" font-style="italic">and I know the secret behind the burn”</text>
<line x1="56" y1="378" x2="304" y2="378" stroke="#DADCDD"/>
<text x="56" y="397.0" font-size="11.5" fill="#505A5F">bridge_sim/, with a simulated lock</text>
<rect x="340" y="252" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="356" y="267" width="123" height="19" fill="#0B0C0C" stroke="#0B0C0C"/>
<text x="364" y="281" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">MODELLED HERE</text>
<text x="356" y="310" font-size="15.5" fill="#0B0C0C" font-weight="700">Time lock</text>
<text x="356" y="332" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="356" y="351" font-size="12.5" fill="#0B0C0C" font-style="italic">“Bitcoin has grown 52,560 blocks</text>
<text x="356" y="368" font-size="12.5" fill="#0B0C0C" font-style="italic">past block X” (about a year)</text>
<line x1="356" y1="378" x2="604" y2="378" stroke="#DADCDD"/>
<text x="356" y="397.0" font-size="11.5" fill="#505A5F">bridge_sim/timelock.py, with a simulated lock</text>
<rect x="640" y="252" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="656" y="267" width="123" height="19" fill="#FFFFFF" stroke="#0B0C0C"/>
<text x="664" y="281" font-size="11" fill="#0B0C0C" font-weight="700" letter-spacing="0.8">TOY DEMO HERE</text>
<text x="656" y="310" font-size="15.5" fill="#0B0C0C" font-weight="700">Reward for a solution</text>
<text x="656" y="332" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="656" y="351" font-size="12.5" fill="#0B0C0C" font-style="italic">“here is a solution to this puzzle”</text>
<text x="656" y="368" font-size="12.5" fill="#0B0C0C" font-style="italic">(in the demo: two factors of 47,053)</text>
<line x1="656" y1="378" x2="904" y2="378" stroke="#DADCDD"/>
<text x="656" y="397.0" font-size="11.5" fill="#505A5F">demo_lock.py, with the real lock at toy size</text>
<rect x="40" y="428" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="56" y="443" width="90" height="19" fill="#F3F2F1" stroke="#B1B4B6"/>
<text x="64" y="457" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<text x="56" y="486" font-size="15.5" fill="#0B0C0C" font-weight="700">Sending to a credential</text>
<text x="56" y="508" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="56" y="527" font-size="12.5" fill="#0B0C0C" font-style="italic">“I hold a certificate from this registry</text>
<text x="56" y="544" font-size="12.5" fill="#0B0C0C" font-style="italic">that says: licensed doctor”</text>
<line x1="56" y1="554" x2="304" y2="554" stroke="#DADCDD"/>
<text x="56" y="573.0" font-size="11.5" fill="#505A5F">needs a rule that checks a signature</text>
<rect x="340" y="428" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="356" y="443" width="90" height="19" fill="#F3F2F1" stroke="#B1B4B6"/>
<text x="364" y="457" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<text x="356" y="486" font-size="15.5" fill="#0B0C0C" font-weight="700">Paying on Bitcoin for a proof</text>
<text x="356" y="508" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="356" y="527" font-size="12.5" fill="#0B0C0C" font-style="italic">“this program ran on this input</text>
<text x="356" y="544" font-size="12.5" fill="#0B0C0C" font-style="italic">and gave this result”</text>
<line x1="356" y1="554" x2="604" y2="554" stroke="#DADCDD"/>
<text x="356" y="573.0" font-size="11.5" fill="#505A5F">the proof checker is the building block</text>
<rect x="640" y="428" width="280" height="160" fill="#FFFFFF" stroke="#B1B4B6"/>
<rect x="656" y="443" width="90" height="19" fill="#F3F2F1" stroke="#B1B4B6"/>
<text x="664" y="457" font-size="11" fill="#505A5F" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<text x="656" y="486" font-size="15.5" fill="#0B0C0C" font-weight="700">Spending rules on Bitcoin</text>
<text x="656" y="508" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="656" y="527" font-size="12.5" fill="#0B0C0C" font-style="italic">“this spend follows the rule</text>
<text x="656" y="544" font-size="12.5" fill="#0B0C0C" font-style="italic">the coins were sealed under”</text>
<line x1="656" y1="554" x2="904" y2="554" stroke="#DADCDD"/>
<text x="656" y="573.0" font-size="11.5" fill="#505A5F">called covenants; needs extra design</text>
<line x1="40" y1="614" x2="920" y2="614" stroke="#B1B4B6" stroke-width="1"/>
<text x="40" y="634" font-size="12.5" fill="#0B0C0C"><tspan font-weight="700">Only the rule changes.</tspan> The lock and the proof checker are the same for every use. None of it runs at real size here.</text>
<text x="40" y="653" font-size="11.5" fill="#505A5F">Source: Bitcoin Witness Bridge Simulator. All but the reward are uses named in the Praxis paper (ePrint 2026/2971).</text>
</svg>
