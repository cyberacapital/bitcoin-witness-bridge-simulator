<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 634" width="960" height="634" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">One lock, many uses</title>
<desc id="d">A secret is sealed to a rule and opens for whoever can prove the rule was met. Six uses: a bridge without a custodian and a time lock (both modelled here), a reward for a solution (toy demo here), and three that are not coded: sending to a credential, paying on Bitcoin when a proof exists, and spending rules on Bitcoin.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="634" fill="#FFFFFF"/>
<rect x="200" y="20" width="560" height="44" fill="#AF292E"/>
<text x="480.0" y="47.5" font-size="15.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">One lock, many uses</text>
<rect x="40" y="84" width="280" height="80" fill="#F3F2F1"/>
<rect x="40" y="84" width="6" height="80" fill="#AF292E"/>
<text x="62" y="111" font-size="15" fill="#0B0C0C" font-weight="700">A secret</text>
<text x="62" y="131" font-size="12.5" fill="#505A5F">a key, a file, a message</text>
<rect x="340" y="84" width="280" height="80" fill="#F3F2F1"/>
<rect x="340" y="84" width="6" height="80" fill="#AF292E"/>
<text x="362" y="111" font-size="15" fill="#0B0C0C" font-weight="700">sealed to a rule</text>
<text x="362" y="131" font-size="12.5" fill="#505A5F" font-style="italic">“someone can prove that ...”</text>
<rect x="640" y="84" width="280" height="80" fill="#F3F2F1"/>
<rect x="640" y="84" width="6" height="80" fill="#00703C"/>
<text x="662" y="111" font-size="15" fill="#0B0C0C" font-weight="700">opens for any prover</text>
<text x="662" y="131" font-size="12.5" fill="#505A5F">no operator and no judge,</text>
<text x="662" y="148" font-size="12.5" fill="#505A5F">even if the sealer is gone</text>
<line x1="324" y1="124.0" x2="335" y2="124.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<line x1="624" y1="124.0" x2="635" y2="124.0" stroke="#AF292E" stroke-width="1.6" marker-end="url(#r)"/>
<rect x="40" y="184" width="880" height="36" fill="#8A2024"/>
<text x="60" y="207.5" font-size="15.5" fill="#FFFFFF" font-weight="700">The same lock, with six different rules</text>
<rect x="40" y="230" width="280" height="150" fill="#F3F2F1"/>
<rect x="40" y="230" width="6" height="150" fill="#AF292E"/>
<text x="62" y="257" font-size="15" fill="#0B0C0C" font-weight="700">Bridge without a custodian</text>
<text x="62" y="277" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="62" y="296" font-size="12.5" fill="#0B0C0C" font-style="italic">“these tokens were burned on Solana,</text>
<text x="62" y="313" font-size="12.5" fill="#0B0C0C" font-style="italic">and I know the secret behind the burn”</text>
<text x="62" y="337" font-size="11.5" fill="#505A5F">bridge_sim/, with a simulated lock</text>
<rect x="62" y="350" width="123" height="19" fill="#AF292E" stroke="#AF292E"/>
<text x="70" y="364" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">MODELLED HERE</text>
<rect x="340" y="230" width="280" height="150" fill="#F3F2F1"/>
<rect x="340" y="230" width="6" height="150" fill="#AF292E"/>
<text x="362" y="257" font-size="15" fill="#0B0C0C" font-weight="700">Time lock</text>
<text x="362" y="277" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="362" y="296" font-size="12.5" fill="#0B0C0C" font-style="italic">“Bitcoin has grown 52,560 blocks</text>
<text x="362" y="313" font-size="12.5" fill="#0B0C0C" font-style="italic">past block X” (about a year)</text>
<text x="362" y="337" font-size="11.5" fill="#505A5F">bridge_sim/timelock.py, with a simulated lock</text>
<rect x="362" y="350" width="123" height="19" fill="#AF292E" stroke="#AF292E"/>
<text x="370" y="364" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">MODELLED HERE</text>
<rect x="640" y="230" width="280" height="150" fill="#F3F2F1"/>
<rect x="640" y="230" width="6" height="150" fill="#AF292E"/>
<text x="662" y="257" font-size="15" fill="#0B0C0C" font-weight="700">Reward for a solution</text>
<text x="662" y="277" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="662" y="296" font-size="12.5" fill="#0B0C0C" font-style="italic">“here is a solution to this puzzle”</text>
<text x="662" y="313" font-size="12.5" fill="#0B0C0C" font-style="italic">(in the demo: two factors of 47,053)</text>
<text x="662" y="337" font-size="11.5" fill="#505A5F">demo_lock.py, with the real lock at toy size</text>
<rect x="662" y="350" width="123" height="19" fill="#FFFFFF" stroke="#AF292E"/>
<text x="670" y="364" font-size="11" fill="#AF292E" font-weight="700" letter-spacing="0.8">TOY DEMO HERE</text>
<rect x="40" y="392" width="280" height="150" fill="#F3F2F1"/>
<rect x="40" y="392" width="6" height="150" fill="#505A5F"/>
<text x="62" y="419" font-size="15" fill="#0B0C0C" font-weight="700">Sending to a credential</text>
<text x="62" y="439" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="62" y="458" font-size="12.5" fill="#0B0C0C" font-style="italic">“I hold a certificate from this registry</text>
<text x="62" y="475" font-size="12.5" fill="#0B0C0C" font-style="italic">that says: licensed doctor”</text>
<text x="62" y="499" font-size="11.5" fill="#505A5F">needs a rule that checks a signature</text>
<rect x="62" y="512" width="90" height="19" fill="#505A5F" stroke="#505A5F"/>
<text x="70" y="526" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<rect x="340" y="392" width="280" height="150" fill="#F3F2F1"/>
<rect x="340" y="392" width="6" height="150" fill="#505A5F"/>
<text x="362" y="419" font-size="15" fill="#0B0C0C" font-weight="700">Paying on Bitcoin for a proof</text>
<text x="362" y="439" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="362" y="458" font-size="12.5" fill="#0B0C0C" font-style="italic">“this program ran on this input</text>
<text x="362" y="475" font-size="12.5" fill="#0B0C0C" font-style="italic">and gave this result”</text>
<text x="362" y="499" font-size="11.5" fill="#505A5F">the proof checker is the building block</text>
<rect x="362" y="512" width="90" height="19" fill="#505A5F" stroke="#505A5F"/>
<text x="370" y="526" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<rect x="640" y="392" width="280" height="150" fill="#F3F2F1"/>
<rect x="640" y="392" width="6" height="150" fill="#505A5F"/>
<text x="662" y="419" font-size="15" fill="#0B0C0C" font-weight="700">Spending rules on Bitcoin</text>
<text x="662" y="439" font-size="11.5" fill="#505A5F">Opens for whoever can prove:</text>
<text x="662" y="458" font-size="12.5" fill="#0B0C0C" font-style="italic">“this spend follows the rule</text>
<text x="662" y="475" font-size="12.5" fill="#0B0C0C" font-style="italic">the coins were sealed under”</text>
<text x="662" y="499" font-size="11.5" fill="#505A5F">called covenants; needs extra design</text>
<rect x="662" y="512" width="90" height="19" fill="#505A5F" stroke="#505A5F"/>
<text x="670" y="526" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<rect x="40" y="554" width="880" height="60" fill="#F3F2F1"/>
<rect x="40" y="554" width="6" height="60" fill="#505A5F"/>
<text x="62" y="581" font-size="15" fill="#0B0C0C" font-weight="700">Only the rule changes</text>
<text x="62" y="601" font-size="12.5" fill="#505A5F">The lock and the proof checker are the same for every use. None of it runs at real size here.</text>
</svg>
