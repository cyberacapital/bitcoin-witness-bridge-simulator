<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" width="960" height="446" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Far-future use cases</title>
<desc id="d">Speculation, in two groups. Space and deep time: trade across light-minutes, machines that own themselves, knowledge with an entrance exam. AI and other minds: answers from any kind of mind, a superintelligence seismograph, human and AI treaties. Three things are needed first: the paper survives review, sensors can be trusted, and a quantum-safe version exists.</desc>
