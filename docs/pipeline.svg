<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">From a rule to a lock: what is built here</title>
<desc id="d">Every use goes through the same five stages. Stage 1, the rule as a program: two rules are written in plain Python, the bridge's and a small time lock. Stage 2, a proof that the program said yes: not coded. Stage 3, one small Groth16 proof: a small system that makes real test proofs. Stage 4, the proof checker as lock gates: built, with gaps, 1.4 times the size the paper reports. Stage 5, the lock: built, for tiny examples only.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="660" fill="#FFFFFF"/>
<rect x="40" y="20" width="880" height="44" fill="#AF292E"/>
<text x="60" y="47.5" font-size="15.5" fill="#FFFFFF" font-weight="700">From a rule to a lock: what is built here</text>
<rect x="40" y="76" width="430" height="34" fill="#8A2024"/>
<text x="60" y="98.5" font-size="15.5" fill="#FFFFFF" font-weight="700">The five stages</text>
<rect x="490" y="76" width="430" height="34" fill="#8A2024"/>
<text x="510" y="98.5" font-size="15.5" fill="#FFFFFF" font-weight="700">In this repository</text>
<rect x="40" y="120" width="430" height="78" fill="#F3F2F1"/>
<rect x="40" y="120" width="6" height="78" fill="#AF292E"/>
<rect x="62" y="131" width="22" height="22" fill="#AF292E"/>
<text x="73.0" y="146.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="93" y="147" font-size="15" fill="#0B0C0C" font-weight="700">The rule</text>
<text x="62" y="167" font-size="12.5" fill="#505A5F">A program that looks at evidence</text>
<text x="62" y="184" font-size="12.5" fill="#505A5F">and answers yes or no.</text>
<rect x="490" y="120" width="430" height="78" fill="#F3F2F1"/>
<rect x="490" y="120" width="6" height="78" fill="#AF292E"/>
<rect x="512" y="134" width="155" height="19" fill="#FFFFFF" stroke="#AF292E"/>
<text x="520" y="148" font-size="11" fill="#AF292E" font-weight="700" letter-spacing="0.8">TWO RULES WRITTEN</text>
<text x="512" y="170" font-size="12.5" fill="#0B0C0C">The bridge's rule and a small time lock,</text>
<text x="512" y="187" font-size="12.5" fill="#0B0C0C">in plain Python (bridge_sim/).</text>
<line x1="474" y1="159.0" x2="485" y2="159.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="40" y="210" width="430" height="78" fill="#F3F2F1"/>
<rect x="40" y="210" width="6" height="78" fill="#AF292E"/>
<rect x="62" y="221" width="22" height="22" fill="#AF292E"/>
<text x="73.0" y="236.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="93" y="237" font-size="15" fill="#0B0C0C" font-weight="700">Proof of the run</text>
<text x="62" y="257" font-size="12.5" fill="#505A5F">A zero-knowledge machine proves that</text>
<text x="62" y="274" font-size="12.5" fill="#505A5F">the program said yes.</text>
<rect x="490" y="210" width="430" height="78" fill="#F3F2F1"/>
<rect x="490" y="210" width="6" height="78" fill="#505A5F"/>
<rect x="512" y="224" width="90" height="19" fill="#505A5F" stroke="#505A5F"/>
<text x="520" y="238" font-size="11" fill="#FFFFFF" font-weight="700" letter-spacing="0.8">NOT CODED</text>
<text x="512" y="260" font-size="12.5" fill="#0B0C0C">The paper uses an existing machine.</text>
<text x="512" y="277" font-size="12.5" fill="#0B0C0C">A rule would be rewritten for it.</text>
<line x1="474" y1="249.0" x2="485" y2="249.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="40" y="300" width="430" height="78" fill="#F3F2F1"/>
<rect x="40" y="300" width="6" height="78" fill="#AF292E"/>
<rect x="62" y="311" width="22" height="22" fill="#AF292E"/>
<text x="73.0" y="326.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="93" y="327" font-size="15" fill="#0B0C0C" font-weight="700">One small proof</text>
<text x="62" y="347" font-size="12.5" fill="#505A5F">That proof is wrapped into a single</text>
<text x="62" y="364" font-size="12.5" fill="#505A5F">Groth16 proof of fixed size.</text>
<rect x="490" y="300" width="430" height="78" fill="#F3F2F1"/>
<rect x="490" y="300" width="6" height="78" fill="#AF292E"/>
<rect x="512" y="314" width="164" height="19" fill="#FFFFFF" stroke="#AF292E"/>
<text x="520" y="328" font-size="11" fill="#AF292E" font-weight="700" letter-spacing="0.8">TINY EXAMPLES ONLY</text>
<text x="512" y="350" font-size="12.5" fill="#0B0C0C">A small Groth16 system that makes real</text>
<text x="512" y="367" font-size="12.5" fill="#0B0C0C">test proofs (encoding/groth16.py).</text>
<line x1="474" y1="339.0" x2="485" y2="339.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="40" y="390" width="430" height="78" fill="#F3F2F1"/>
<rect x="40" y="390" width="6" height="78" fill="#AF292E"/>
<rect x="62" y="401" width="22" height="22" fill="#AF292E"/>
<text x="73.0" y="416.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="93" y="417" font-size="15" fill="#0B0C0C" font-weight="700">Proof checker as lock gates</text>
<text x="62" y="437" font-size="12.5" fill="#505A5F">“This proof is valid”, rewritten as</text>
<text x="62" y="454" font-size="12.5" fill="#505A5F">equations over bits.</text>
<rect x="490" y="390" width="430" height="78" fill="#F3F2F1"/>
<rect x="490" y="390" width="6" height="78" fill="#AF292E"/>
<rect x="512" y="404" width="147" height="19" fill="#FFFFFF" stroke="#AF292E"/>
<text x="520" y="418" font-size="11" fill="#AF292E" font-weight="700" letter-spacing="0.8">BUILT, WITH GAPS</text>
<text x="512" y="440" font-size="12.5" fill="#0B0C0C">Checks real proofs, at 1.4× the size the</text>
<text x="512" y="457" font-size="12.5" fill="#0B0C0C">paper reports (praxis_lock/encoding/).</text>
<line x1="474" y1="429.0" x2="485" y2="429.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="40" y="480" width="430" height="78" fill="#F3F2F1"/>
<rect x="40" y="480" width="6" height="78" fill="#AF292E"/>
<rect x="62" y="491" width="22" height="22" fill="#AF292E"/>
<text x="73.0" y="506.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="93" y="507" font-size="15" fill="#0B0C0C" font-weight="700">The lock</text>
<text x="62" y="527" font-size="12.5" fill="#505A5F">A key sealed so that only a solution</text>
<text x="62" y="544" font-size="12.5" fill="#505A5F">of those equations opens it.</text>
<rect x="490" y="480" width="430" height="78" fill="#F3F2F1"/>
<rect x="490" y="480" width="6" height="78" fill="#AF292E"/>
<rect x="512" y="494" width="164" height="19" fill="#FFFFFF" stroke="#AF292E"/>
<text x="520" y="508" font-size="11" fill="#AF292E" font-weight="700" letter-spacing="0.8">TINY EXAMPLES ONLY</text>
<text x="512" y="530" font-size="12.5" fill="#0B0C0C">The real scheme, on small statements.</text>
<text x="512" y="547" font-size="12.5" fill="#0B0C0C">Full size, about 8 GB a key piece, does not run.</text>
<line x1="474" y1="519.0" x2="485" y2="519.0" stroke="#505A5F" stroke-width="1.6" marker-end="url(#g)"/>
<rect x="40" y="570" width="880" height="60" fill="#F3F2F1"/>
<rect x="40" y="570" width="6" height="60" fill="#505A5F"/>
<text x="62" y="597" font-size="15" fill="#0B0C0C" font-weight="700">Stages 2 to 5 are the same for every use</text>
<text x="62" y="617" font-size="12.5" fill="#505A5F">A new use needs only a new rule in stage 1.</text>
</svg>
