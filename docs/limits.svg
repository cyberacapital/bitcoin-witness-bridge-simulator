<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">What every use has to live with</title>
<desc id="d">Six limits. The rule is fixed when the lock is made. Whoever has a proof opens it, once and for all. Evidence can be forged at a price. Each sealed key piece is about 8 GB of public data in the paper and about 11 GB with this repository's encoding. One setup stands behind every lock. It is not safe against quantum computers and has not been reviewed.</desc>
<defs><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#AF292E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#505A5F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="392" fill="#FFFFFF"/>
<rect x="40" y="20" width="880" height="44" fill="#AF292E"/>
<text x="60" y="47.5" font-size="15.5" fill="#FFFFFF" font-weight="700">What every use has to live with</text>
<rect x="40" y="78" width="280" height="102" fill="#F3F2F1"/>
<rect x="40" y="78" width="6" height="102" fill="#505A5F"/>
<rect x="62" y="89" width="22" height="22" fill="#505A5F"/>
<text x="73.0" y="104.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text>
<text x="93" y="105" font-size="15" fill="#0B0C0C" font-weight="700">The rule is fixed</text>
<text x="62" y="125" font-size="12.5" fill="#505A5F">It is set when the lock is made and</text>
<text x="62" y="142" font-size="12.5" fill="#505A5F">cannot be changed or withdrawn.</text>
<text x="62" y="159" font-size="12.5" fill="#505A5F">It sees only what a proof shows it.</text>
<rect x="340" y="78" width="280" height="102" fill="#F3F2F1"/>
<rect x="340" y="78" width="6" height="102" fill="#505A5F"/>
<rect x="362" y="89" width="22" height="22" fill="#505A5F"/>
<text x="373.0" y="104.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text>
<text x="393" y="105" font-size="15" fill="#0B0C0C" font-weight="700">Whoever has a proof opens</text>
<text x="362" y="125" font-size="12.5" fill="#505A5F">The lock does not know who anyone</text>
<text x="362" y="142" font-size="12.5" fill="#505A5F">is. Public evidence means a public</text>
<text x="362" y="159" font-size="12.5" fill="#505A5F">secret. Opening is once and for all.</text>
<rect x="640" y="78" width="280" height="102" fill="#F3F2F1"/>
<rect x="640" y="78" width="6" height="102" fill="#505A5F"/>
<rect x="662" y="89" width="22" height="22" fill="#505A5F"/>
<text x="673.0" y="104.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text>
<text x="693" y="105" font-size="15" fill="#0B0C0C" font-weight="700">Evidence can be forged</text>
<text x="662" y="125" font-size="12.5" fill="#505A5F">At a price. A time lock is as strong</text>
<text x="662" y="142" font-size="12.5" fill="#505A5F">as the cost of mining its blocks in</text>
<text x="662" y="159" font-size="12.5" fill="#505A5F">secret; a signature rule, as its keys.</text>
<rect x="40" y="194" width="280" height="102" fill="#F3F2F1"/>
<rect x="40" y="194" width="6" height="102" fill="#505A5F"/>
<rect x="62" y="205" width="22" height="22" fill="#505A5F"/>
<text x="73.0" y="220.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text>
<text x="93" y="221" font-size="15" fill="#0B0C0C" font-weight="700">Large and heavy</text>
<text x="62" y="241" font-size="12.5" fill="#505A5F">About 8 GB of public data for each</text>
<text x="62" y="258" font-size="12.5" fill="#505A5F">sealed key piece in the paper, about</text>
<text x="62" y="275" font-size="12.5" fill="#505A5F">11 GB here. Heavy to make and open.</text>
<rect x="340" y="194" width="280" height="102" fill="#F3F2F1"/>
<rect x="340" y="194" width="6" height="102" fill="#505A5F"/>
<rect x="362" y="205" width="22" height="22" fill="#505A5F"/>
<text x="373.0" y="220.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">5</text>
<text x="393" y="221" font-size="15" fill="#0B0C0C" font-weight="700">One setup for every lock</text>
<text x="362" y="241" font-size="12.5" fill="#505A5F">Whoever ran the proof system's setup</text>
<text x="362" y="258" font-size="12.5" fill="#505A5F">and kept its secret numbers can open</text>
<text x="362" y="275" font-size="12.5" fill="#505A5F">every lock made for that key.</text>
<rect x="640" y="194" width="280" height="102" fill="#F3F2F1"/>
<rect x="640" y="194" width="6" height="102" fill="#505A5F"/>
<rect x="662" y="205" width="22" height="22" fill="#505A5F"/>
<text x="673.0" y="220.5" font-size="12.5" fill="#FFFFFF" font-weight="700" text-anchor="middle">6</text>
<text x="693" y="221" font-size="15" fill="#0B0C0C" font-weight="700">New and unreviewed</text>
<text x="662" y="241" font-size="12.5" fill="#505A5F">The paper is from 2026 and has not</text>
<text x="662" y="258" font-size="12.5" fill="#505A5F">been reviewed. The scheme is not</text>
<text x="662" y="275" font-size="12.5" fill="#505A5F">safe against quantum computers.</text>
<rect x="40" y="312" width="880" height="60" fill="#F3F2F1"/>
<rect x="40" y="312" width="6" height="60" fill="#505A5F"/>
<text x="62" y="339" font-size="15" fill="#0B0C0C" font-weight="700">On top of these, this repository has no security at all</text>
<text x="62" y="359" font-size="12.5" fill="#505A5F">The lock in bridge_sim/ is simulated and praxis_lock/ runs at toy size.</text>
</svg>
