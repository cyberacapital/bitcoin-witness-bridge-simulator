<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" width="960" height="516" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Use cases</title>
<desc id="d">Two groups. Money on Bitcoin: borrowing against Bitcoin, moving Bitcoin to other networks (modelled here), self-custody safes, prizes that pay themselves (toy demo here). Alarms and information: tripwire alarms, time capsules (modelled here), an inheritance switch, credential-locked files. The paper is new and unreviewed and needs an honest one-time setup.</desc>
