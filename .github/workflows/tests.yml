name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the pairing library (optional dependency)
        run: pip install py_ecc
      - name: Run every test
        run: python -m unittest -v
      - name: Run the bridge demo
        run: python demo.py
      - name: Run the lock demo with real pairings
        run: python demo_lock.py
